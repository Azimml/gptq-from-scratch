name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        # The CPU wheel keeps CI fast and avoids pulling CUDA runtimes.
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"

      - name: Install project + dev tooling
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy, non-blocking)
        continue-on-error: true
        run: mypy arch_config.py evaluate.py gptq.py main.py model_utils.py quantize.py

      - name: Run tests (pytest)
        # Tests build tiny models from config, so they run fully offline on CPU.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -v
